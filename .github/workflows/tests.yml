name: tests
on: [push, pull_request]
jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install with the optional Numpress decoder
        if: matrix.python != '3.13'
        run: python -m pip install -e ".[dev,numpress]"
      - name: Build Numpress with the installed NumPy on Python 3.13
        if: matrix.python == '3.13'
        # pynumpress 0.0.9 pins NumPy 2.0 in its isolated build environment;
        # that NumPy release has no Python 3.13 wheels.
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "setuptools>=77" wheel Cython
          python -m pip install --no-build-isolation "pynumpress>=0.0.9,<0.1"
      - run: ruff check src tests benchmarks
      - run: python -m pytest -q --junitxml=test-results-source.xml
      - run: python -m build
      - name: Install the built wheel
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', glob.glob('dist/*.whl')[0]])"
      - name: Test the installed wheel without the source-path override
        run: python -m pytest -q -o pythonpath= --junitxml=test-results-wheel.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python }}
          path: test-results-*.xml
