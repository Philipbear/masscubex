# Modified for MassCubeX: a focused, streaming MS1 feature extractor.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "masscubex"
version = "0.16.0"
description = "Streaming mzML/mzXML to per-file MS1 feature tables"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE", "NOTICE", "licenses/SCIPY-BSD-3-Clause.txt", "licenses/NUMPY-BSD-3-Clause.txt"]
# The verbatim MassCube reference uses np.trapz, removed in NumPy 2.4.
dependencies = ["numpy>=1.24,<2.4", "numba>=0.60", "scipy>=1.10", "lxml>=4.9", "pyarrow>=17"]

[project.optional-dependencies]
numpress = ["pynumpress>=0.0.9,<0.1"]
dev = ["pytest>=8", "build", "ruff", "psutil>=5.9"]

[project.scripts]
masscubex = "masscubex.cli:main"

[project.urls]
Repository = "https://github.com/Philipbear/masscubex"
Documentation = "https://github.com/Philipbear/masscubex/tree/main/docs"
Issues = "https://github.com/Philipbear/masscubex/issues"
Upstream = "https://github.com/huaxuyu/masscube"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
masscubex = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
